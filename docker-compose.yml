version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: document-db
    restart: always
    environment:
      POSTGRES_DB: document_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: naglar2026
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: document-backend
    restart: always
    depends_on:
      - postgres
    env_file:
      - ./backend/.env.docker
    ports:
      - "3001:3001"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/processed:/app/processed
      - hf-cache:/root/.cache/huggingface


  frontend:
    build: ./frontend
    container_name: document-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  hf-cache: